name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint:js

      - name: Lint (biome)
        run: bun run lint:style

      - name: Lint (stylelint / BEM)
        run: bun run lint:css

      - name: Test
        run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: bun run test:e2e

      - name: Dead code and health (fallow)
        run: bunx fallow
